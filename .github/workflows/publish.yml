name: Publish

# Dispatch this workflow on the reviewed version tag, such as v0.1.0.post1.
# Uploads are never triggered
# by a push or pull request. Configure the PyPI trusted publishers before use.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: structwire-publication
  cancel-in-progress: false

jobs:
  release-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag in the owning repository
        env:
          STRUCTWIRE_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          if os.environ["STRUCTWIRE_REPOSITORY"] != "nidops/structwire":
              raise SystemExit("Run publishing from nidops/structwire")
          if not os.environ["GITHUB_REF"].startswith("refs/tags/v"):
              raise SystemExit("Select the reviewed version tag when dispatching Publish")
          PY

  validate:
    needs: release-tag
    uses: ./.github/workflows/ci.yml

  testpypi:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/structwire
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Upload verified distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    needs: testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Verify TestPyPI wheel hash and clean installed tests
        run: python scripts/verify_install.py dist --index-url https://test.pypi.org/simple/

  pypi:
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/structwire
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Upload the same verified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  verify-pypi:
    needs: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Verify PyPI wheel hash and clean installed tests
        run: python scripts/verify_install.py dist --index-url https://pypi.org/simple/
